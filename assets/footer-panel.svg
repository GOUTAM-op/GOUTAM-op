<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04050f"/>
      <stop offset="50%" stop-color="#0d0e2a"/>
      <stop offset="100%" stop-color="#04050f"/>
    </linearGradient>
    <linearGradient id="panelGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="textGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8ff5ff"/>
      <stop offset="100%" stop-color="#ff8fe0"/>
    </linearGradient>
    <filter id="softGlow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="220" fill="url(#footBg2)"/>

  <!-- constellation -->
  <g stroke="#5b7fd8" stroke-width="1" opacity="0.35">
    <line x1="130" y1="45" x2="230" y2="75" stroke-dasharray="110" stroke-dashoffset="110">
      <animate attributeName="stroke-dashoffset" values="110;0;0;110" keyTimes="0;0.3;0.7;1" dur="6s" repeatCount="indefinite"/>
    </line>
    <line x1="230" y1="75" x2="190" y2="135" stroke-dasharray="70" stroke-dashoffset="70">
      <animate attributeName="stroke-dashoffset" values="70;0;0;70" keyTimes="0;0.3;0.7;1" dur="6s" begin="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="970" y1="55" x2="1070" y2="95" stroke-dasharray="110" stroke-dashoffset="110">
      <animate attributeName="stroke-dashoffset" values="110;0;0;110" keyTimes="0;0.3;0.7;1" dur="6s" begin="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="1070" y1="95" x2="1010" y2="155" stroke-dasharray="90" stroke-dashoffset="90">
      <animate attributeName="stroke-dashoffset" values="90;0;0;90" keyTimes="0;0.3;0.7;1" dur="6s" begin="0.9s" repeatCount="indefinite"/>
    </line>
  </g>
  <g fill="#ffffff">
    <circle cx="130" cy="45" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="75" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="135" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="970" cy="55" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1070" cy="95" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="155" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="30" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- comet -->
  <circle r="2.3" fill="#ffffff" filter="url(#softGlow2)">
    <animateMotion path="M -50,40 L 1250,190" dur="5s" repeatCount="indefinite" begin="2s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.8;1" dur="5s" repeatCount="indefinite" begin="2s"/>
  </circle>

  <!-- drifting particles -->
  <g fill="#00e5ff" opacity="0.55">
    <circle cx="320" cy="205" r="2.3">
      <animate attributeName="cy" values="215;10;215" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="205" r="2.3" fill="#ff2fb2">
      <animate attributeName="cy" values="215;10;215" dur="10s" begin="-4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="10s" begin="-4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- drifting particle, third color -->
  <g fill="#7b2ff7" opacity="0.5">
    <circle cx="600" cy="205" r="2">
      <animate attributeName="cy" values="215;10;215" dur="11s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.65;0" dur="11s" begin="-2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- soft glow pulse behind the glass panel -->
  <rect x="290" y="70" width="620" height="90" rx="20" fill="#00e5ff" opacity="0.06" filter="url(#softGlow2)">
    <animate attributeName="opacity" values="0.03;0.1;0.03" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- glass panel -->
  <rect x="290" y="70" width="620" height="90" rx="20" fill="url(#panelGrad2)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.08;0.22;0.08" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="112" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="url(#textGrad2)" filter="url(#softGlow2)">
    Thanks for visiting my profile! ✨
  </text>
  <text x="600" y="140" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#b9c8ff" opacity="0.85">
    Always open to interesting projects, internships, and collaborations.
  </text>

  <path fill="#0d0e2a" fill-opacity="0.9">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="
        M0,200 C 200,185 400,215 600,200 C 800,185 1000,215 1200,200 L1200,220 L0,220 Z;
        M0,208 C 200,220 400,190 600,205 C 800,222 1000,188 1200,205 L1200,220 L0,220 Z;
        M0,200 C 200,185 400,215 600,200 C 800,185 1000,215 1200,200 L1200,220 L0,220 Z
      "/>
  </path>
</svg>
