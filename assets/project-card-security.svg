<svg width="380" height="230" viewBox="0 0 380 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <clipPath id="clip2"><rect x="1" y="1" width="378" height="228" rx="16"/></clipPath>
  </defs>

  <rect x="1" y="1" width="378" height="228" rx="16" fill="#0a0b1f"/>
  <rect x="1" y="1" width="378" height="228" rx="16" fill="url(#cardBg2)"/>
  <rect x="1" y="1" width="378" height="228" rx="16" fill="none" stroke="#ff2fb2" stroke-opacity="0.45" stroke-width="1.4">
    <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" begin="-1s" repeatCount="indefinite"/>
  </rect>

  <g fill="#ff8fe0">
    <circle cx="360" cy="18" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="345" cy="30" r="1.2"><animate attributeName="opacity" values="1;0.15;1" dur="3.1s" repeatCount="indefinite"/></circle>
  </g>

  <g clip-path="url(#clip2)">
    <rect x="-140" y="0" width="80" height="230" fill="#ff8fe0" opacity="0.08" transform="skewX(-20)">
      <animateTransform attributeName="transform" type="translate" values="-40 0;520 0" dur="4.5s" begin="-1.5s" repeatCount="indefinite" additive="sum"/>
    </rect>
  </g>

  <text x="24" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#ffe8f8">🔐 Password Security Toolkit</text>
  <text x="24" y="72" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#e2b9d4">
    <tspan x="24" dy="0">Evaluates password strength and</tspan>
    <tspan x="24" dy="18">simulates dictionary attacks to</tspan>
    <tspan x="24" dy="18">flag common vulnerabilities.</tspan>
  </text>

  <g font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600">
    <rect x="24" y="150" width="58" height="24" rx="12" fill="none" stroke="#ff2fb2" stroke-opacity="0.6"/>
    <text x="53" y="166" text-anchor="middle" fill="#ff8fe0">Python</text>
    <rect x="88" y="150" width="110" height="24" rx="12" fill="none" stroke="#7b2ff7" stroke-opacity="0.6"/>
    <text x="143" y="166" text-anchor="middle" fill="#c9a7ff">Cybersecurity</text>
  </g>

  <text x="24" y="205" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#ff2fb2" font-weight="700">🔗 View Repository →</text>

  <filter id="cardBlur_clip2" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="16"/></filter>

  <!-- corner ambient glow -->
  <ellipse cx="10" cy="8" rx="70" ry="46" fill="#ff2fb2" opacity="0.14" filter="url(#cardBlur_clip2)">
    <animate attributeName="opacity" values="0.08;0.2;0.08" dur="3.6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- drifting micro sparkles -->
  <g fill="#ff2fb2">
    <circle cx="300" cy="120" r="1.3" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0" keyTimes="0;0.3;0.5;1" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="120;108;120" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="270" cy="190" r="1" opacity="0">
      <animate attributeName="opacity" values="0;0;0.8;0" keyTimes="0;0.4;0.6;1" dur="3.6s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="190;180;190" dur="3.6s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- glowing accent bar at bottom -->
  <rect x="1" y="223" width="378" height="3" rx="1.5" fill="#ff2fb2" opacity="0.55">
    <animate attributeName="opacity" values="0.3;0.75;0.3" dur="2.8s" repeatCount="indefinite"/>
  </rect>
</svg>
