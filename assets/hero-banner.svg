<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04050f"/>
      <stop offset="55%" stop-color="#0a0b1f"/>
      <stop offset="100%" stop-color="#0d0a24"/>
    </linearGradient>

    <linearGradient id="auroraA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7b2ff7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="auroraB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2fb2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff2fb2" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="auroraC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7b2ff7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ffc6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7b2ff7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="nameGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#8ff5ff"/>
      <stop offset="100%" stop-color="#ff8fe0"/>
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#7b2ff7"/>
      <stop offset="100%" stop-color="#ff2fb2"/>
    </linearGradient>

    <radialGradient id="hexGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hexGlowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2fb2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff2fb2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>

    <clipPath id="avatarClip">
      <circle cx="0" cy="0" r="76"/>
    </clipPath>

    <filter id="softBlur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="softBlurSm"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="glow2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow3" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg2)"/>

  <!-- fine starfield dust -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="20" cy="20" r="0.8"/><circle cx="140" cy="60" r="0.7"/><circle cx="260" cy="15" r="0.9"/>
    <circle cx="380" cy="80" r="0.6"/><circle cx="500" cy="30" r="0.8"/><circle cx="620" cy="55" r="0.7"/>
    <circle cx="740" cy="18" r="0.9"/><circle cx="960" cy="45" r="0.7"/><circle cx="1080" cy="70" r="0.8"/>
    <circle cx="30" cy="320" r="0.7"/><circle cx="200" cy="335" r="0.8"/><circle cx="420" cy="310" r="0.6"/>
    <circle cx="640" cy="330" r="0.9"/><circle cx="820" cy="315" r="0.7"/><circle cx="1000" cy="335" r="0.8"/>
  </g>

  <!-- drifting aurora ribbons -->
  <g filter="url(#softBlur)" opacity="0.85">
    <path fill="none" stroke="url(#auroraA)" stroke-width="70">
      <animate attributeName="d" dur="10s" repeatCount="indefinite" values="
        M-100,90 C 200,40 500,140 800,80 C 950,50 1100,90 1300,70;
        M-100,110 C 200,150 500,60 800,120 C 950,150 1100,100 1300,120;
        M-100,90 C 200,40 500,140 800,80 C 950,50 1100,90 1300,70"/>
    </path>
    <path fill="none" stroke="url(#auroraB)" stroke-width="60">
      <animate attributeName="d" dur="12s" begin="-3s" repeatCount="indefinite" values="
        M-100,180 C 250,220 550,140 850,190 C 1000,210 1150,170 1300,190;
        M-100,160 C 250,120 550,210 850,150 C 1000,120 1150,200 1300,160;
        M-100,180 C 250,220 550,140 850,190 C 1000,210 1150,170 1300,190"/>
    </path>
    <path fill="none" stroke="url(#auroraC)" stroke-width="55">
      <animate attributeName="d" dur="14s" begin="-6s" repeatCount="indefinite" values="
        M-100,260 C 250,230 550,290 850,250 C 1000,230 1150,270 1300,250;
        M-100,270 C 250,300 550,240 850,280 C 1000,300 1150,250 1300,270;
        M-100,260 C 250,230 550,290 850,250 C 1000,230 1150,270 1300,250"/>
    </path>
  </g>

  <!-- scattered twinkling stars -->
  <g fill="#ffffff">
    <circle cx="90" cy="40" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="290" r="1.2"><animate attributeName="opacity" values="1;0.15;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="160" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="45" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="290" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="60" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="270" r="1.5"><animate attributeName="opacity" values="1;0.15;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="30" r="1.2"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="250" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="310" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 4-point sparkle bursts -->
  <g fill="none" stroke-linecap="round">
    <g transform="translate(120,110)" stroke="#8ff5ff" stroke-width="1.4" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.3;0.5;1" dur="5s" repeatCount="indefinite"/>
      <path d="M0,-9 L0,9 M-9,0 L9,0"/>
    </g>
    <g transform="translate(760,60)" stroke="#ff8fe0" stroke-width="1.4" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.4;0.6;1" dur="6s" begin="1.5s" repeatCount="indefinite"/>
      <path d="M0,-7 L0,7 M-7,0 L7,0"/>
    </g>
    <g transform="translate(870,300)" stroke="#c9a7ff" stroke-width="1.4" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.35;0.55;1" dur="5.5s" begin="2.6s" repeatCount="indefinite"/>
      <path d="M0,-8 L0,8 M-8,0 L8,0"/>
    </g>
    <g transform="translate(560,300)" stroke="#8fffe0" stroke-width="1.4" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.3;0.5;1" dur="4.5s" begin="0.8s" repeatCount="indefinite"/>
      <path d="M0,-6 L0,6 M-6,0 L6,0"/>
    </g>
  </g>

  <!-- breathing glow behind the name -->
  <ellipse cx="290" cy="150" rx="260" ry="70" fill="#00e5ff" opacity="0.08" filter="url(#softBlur)">
    <animate attributeName="opacity" values="0.05;0.16;0.05" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="240;280;240" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- comets -->
  <circle r="1.8" fill="#8ff5ff" filter="url(#glow2)">
    <animateMotion path="M 1250,20 L -50,150" dur="6s" repeatCount="indefinite" begin="3.2s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.8;1" dur="6s" repeatCount="indefinite" begin="3.2s"/>
  </circle>
  <g>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" filter="url(#glow2)">
      <animateMotion path="M -50,60 L 1250,230" dur="4s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.8;1" dur="4s" repeatCount="indefinite" begin="1s"/>
    </circle>
  </g>

  <!-- ===== PHOTO AVATAR, orbited by glowing rings + hex accents ===== -->
  <g transform="translate(1005,175)">
    <animateTransform attributeName="transform" type="translate" values="1005 175; 1005 160; 1005 175" dur="6s" repeatCount="indefinite"/>

    <!-- outer aura -->
    <circle r="140" fill="url(#hexGlow)" opacity="0.35">
      <animate attributeName="r" values="130;148;130" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle r="95" fill="url(#hexGlowPink)" opacity="0.35">
      <animate attributeName="r" values="88;100;88" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- rotating dashed orbit rings -->
    <circle r="108" fill="none" stroke="url(#ringGrad)" stroke-width="1.4" stroke-dasharray="4 10" opacity="0.65">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="30s" repeatCount="indefinite"/>
    </circle>
    <circle r="98" fill="none" stroke="#8ff5ff" stroke-width="1" stroke-dasharray="2 8" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="22s" repeatCount="indefinite"/>
    </circle>

    <!-- orbiting hex accents -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="16s" repeatCount="indefinite"/>
      <polygon points="0,-118 6,-112 6,-106 -6,-106 -6,-112" fill="#00e5ff" opacity="0.9" filter="url(#glow2)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="180;540" dur="16s" repeatCount="indefinite"/>
      <polygon points="0,-118 6,-112 6,-106 -6,-106 -6,-112" fill="#ff2fb2" opacity="0.9" filter="url(#glow2)"/>
    </g>

    <!-- avatar ring (gradient border) -->
    <circle r="80" fill="url(#ringGrad)" filter="url(#glow3)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="76" fill="#04050f"/>

    <!-- ============================================================
         PHOTO SLOT: replace href below with your image
         (a base64 data URI works great and keeps this file self-contained,
         e.g. href="data:image/jpeg;base64,....")
         ============================================================ -->
    <g clip-path="url(#avatarClip)">
      <image href="pic.png"
      <circle r="76" fill="url(#avatarGlow)" opacity="0"/>
    </g>

    <!-- glass rim highlight -->
    <circle r="76" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  </g>

  <!-- name + subtitle, left aligned -->
  <text x="60" y="155" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="url(#nameGrad2)" filter="url(#glow2)">
    GOUTAM KAITY
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="62" y="193" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#a9c3ff" opacity="0.9">
    Web Developer · AI &amp; ML Enthusiast · Cybersecurity Tinkerer
  </text>

  <!-- glass tag chips -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600">
    <g>
      <rect x="62" y="217" width="88" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#00e5ff" stroke-opacity="0.6">
        <animate attributeName="stroke-opacity" values="0.35;0.9;0.35" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <text x="106" y="236" text-anchor="middle" fill="#8ff5ff">Python</text>
    </g>
    <g>
      <rect x="160" y="217" width="98" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ff2fb2" stroke-opacity="0.6">
        <animate attributeName="stroke-opacity" values="0.35;0.9;0.35" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
      </rect>
      <text x="209" y="236" text-anchor="middle" fill="#ff8fe0">React.js</text>
    </g>
    <g>
      <rect x="268" y="217" width="80" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#7b2ff7" stroke-opacity="0.6">
        <animate attributeName="stroke-opacity" values="0.35;0.9;0.35" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      </rect>
      <text x="308" y="236" text-anchor="middle" fill="#c9a7ff">AI/ML</text>
    </g>
    <g>
      <rect x="358" y="217" width="128" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#00ffc6" stroke-opacity="0.6">
        <animate attributeName="stroke-opacity" values="0.35;0.9;0.35" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/>
      </rect>
      <text x="422" y="236" text-anchor="middle" fill="#8fffe0">Cybersecurity</text>
    </g>
  </g>

  <!-- thin animated gradient rule -->
  <rect x="62" y="267" width="420" height="2" fill="url(#nameGrad2)" opacity="0.6">
    <animate attributeName="width" values="0;420;420" keyTimes="0;0.6;1" dur="2.2s" fill="freeze"/>
    <animate attributeName="opacity" values="0.4;0.85;0.4" dur="3s" begin="2.2s" repeatCount="indefinite"/>
  </rect>

  <rect width="1200" height="360" fill="url(#vignette)"/>
</svg>
