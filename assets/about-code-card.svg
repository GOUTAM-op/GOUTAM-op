<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="codeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b1f"/>
      <stop offset="100%" stop-color="#0d0a24"/>
    </linearGradient>
    <linearGradient id="panelSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.015"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#7b2ff7"/>
      <stop offset="100%" stop-color="#ff2fb2"/>
    </linearGradient>
    <clipPath id="cardClip"><rect x="1" y="1" width="798" height="398" rx="18"/></clipPath>
    <filter id="cGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cBlur"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>

  <rect width="800" height="400" fill="#04050f"/>

  <!-- ambient corner glows -->
  <ellipse cx="10" cy="0" rx="90" ry="60" fill="#00e5ff" opacity="0.14" filter="url(#cBlur)">
    <animate attributeName="opacity" values="0.08;0.2;0.08" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="790" cy="400" rx="90" ry="60" fill="#ff2fb2" opacity="0.12" filter="url(#cBlur)">
    <animate attributeName="opacity" values="0.06;0.18;0.06" dur="4.5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- card body -->
  <rect x="1" y="1" width="798" height="398" rx="18" fill="url(#codeBg)"/>
  <rect x="1" y="1" width="798" height="398" rx="18" fill="url(#panelSheen)"/>
  <rect x="1" y="1" width="798" height="398" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="1.4" opacity="0.65">
    <animate attributeName="opacity" values="0.4;0.85;0.4" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- diagonal shimmer sweep -->
  <g clip-path="url(#cardClip)">
    <rect x="-160" y="0" width="110" height="400" fill="#8ff5ff" opacity="0.05" transform="skewX(-20)">
      <animateTransform attributeName="transform" type="translate" values="-60 0;900 0" dur="6s" repeatCount="indefinite" additive="sum"/>
    </rect>
  </g>

  <!-- title bar -->
  <rect x="1" y="1" width="798" height="38" rx="18" fill="#ffffff" fill-opacity="0.03"/>
  <rect x="1" y="20" width="798" height="19" fill="#ffffff" fill-opacity="0.03"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="20" r="6" fill="#27c93f"/>
  <text x="400" y="25" text-anchor="middle" font-family="'Fira Code','Consolas',monospace" font-size="12" fill="#7d8bb5">about_me.py</text>

  <!-- code lines -->
  <g font-family="'Fira Code','Consolas',monospace" font-size="13.3">
    <text x="24" y="70"  fill="#ff8fe0">class</text>
    <text x="72" y="70"  fill="#8ff5ff">GoutamKaity</text>
    <text x="196" y="70" fill="#c9d4f0">:</text>

    <text x="48" y="98"  fill="#ff8fe0">def</text>
    <text x="82" y="98"  fill="#8ff5ff">__init__</text>
    <text x="168" y="98" fill="#c9d4f0">(self):</text>

    <text x="72" y="126" fill="#c9d4f0">self.role </text>
    <text x="152" y="126" fill="#c9a7ff">= </text>
    <text x="172" y="126" fill="#8fffe0">"CS Undergraduate @ ARYAN Institute of Engineering and Technology"</text>

    <text x="72" y="154" fill="#c9d4f0">self.focus </text>
    <text x="160" y="154" fill="#c9a7ff">= </text>
    <text x="180" y="154" fill="#8fffe0">["Web Development", "AI / Machine Learning", "Cybersecurity"]</text>

    <text x="72" y="182" fill="#c9d4f0">self.currently_building </text>
    <text x="248" y="182" fill="#c9a7ff">= </text>
    <text x="268" y="182" fill="#8fffe0">"AI-powered tools and full-stack web apps"</text>

    <text x="72" y="210" fill="#c9d4f0">self.looking_for </text>
    <text x="212" y="210" fill="#c9a7ff">= </text>
    <text x="232" y="210" fill="#8fffe0">"Web Developer / Software Developer Internship"</text>

    <text x="72" y="238" fill="#c9d4f0">self.location </text>
    <text x="188" y="238" fill="#c9a7ff">= </text>
    <text x="208" y="238" fill="#8fffe0">"Bhubaneswar, Odisha, India"</text>

    <text x="48" y="272" fill="#ff8fe0">def</text>
    <text x="82" y="272" fill="#8ff5ff">say_hi</text>
    <text x="150" y="272" fill="#c9d4f0">(self):</text>

    <text x="72" y="300" fill="#00e5ff" filter="url(#cGlow)">print</text>
    <text x="118" y="300" fill="#c9d4f0">(</text>
    <text x="126" y="300" fill="#8fffe0">"Thanks for stopping by — let's build something!"</text>
    <text x="516" y="300" fill="#c9d4f0">)</text>

    <!-- blinking cursor -->
    <rect x="530" y="288" width="9" height="16" fill="#00e5ff" filter="url(#cGlow)">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- run indicator footer -->
  <g font-family="'Fira Code','Consolas',monospace" font-size="12.5">
    <circle cx="28" cy="368" r="4" fill="#27c93f">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="42" y="372" fill="#7fe0a0">GoutamKaity().say_hi()</text>
    <text x="210" y="372" fill="#5b6a95"># prints the greeting above</text>
  </g>
</svg>
